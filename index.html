<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>אות ראשונה — משחק עברית</title>
  <style>
    :root {
      --deep: #12314a;
      --mid: #1f6f7a;
      --shore: #37b3a0;
      --cream: #fff6e6;
      --cream2: #ffeccd;
      --ink: #14293d;
      --sun: #ffc93c;
      --sun-dk: #e8a600;
      --good: #2f9e44;
      --good-l: #b7ecc0;
      --bad: #e03131;
      --bad-l: #ffd3d3;
      --shadow: 0 8px 0 rgba(0, 0, 0, .18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Rubik", "Assistant", "Noto Sans Hebrew", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 26px;
      overflow-x: hidden;
    }

    /* Two stacked sky layers so a new world can fade in over the old one. */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(255, 201, 60, .35), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(55, 179, 160, .45), transparent 60%),
        linear-gradient(165deg, var(--deep) 0%, var(--mid) 58%, var(--shore) 100%);
    }

    .sky.next {
      opacity: 0;
      transition: opacity 1.1s ease;
    }

    /* soft dotted texture over the background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, .10) 1.5px, transparent 1.6px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 1;
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      margin: 0;
      color: var(--cream);
      letter-spacing: 0;
      text-shadow: 0 3px 0 rgba(0, 0, 0, .25);
    }

    .hud {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .pill {
      background: rgba(255, 246, 230, .16);
      border: 2px solid rgba(255, 246, 230, .35);
      border-radius: 999px;
      padding: 7px 14px;
      color: var(--cream);
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.level {
      background: var(--sun);
      border-color: var(--sun-dk);
      color: var(--ink);
    }

    .pill.cycles {
      background: rgba(255, 201, 60, .28);
      border-color: var(--sun);
    }

    .pill.hidden {
      display: none;
    }

    .pill.bump {
      animation: bump .45s cubic-bezier(.2, 1.6, .4, 1);
    }

    /* The level pill doubles as the button that opens the level picker. */
    button.pill {
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    button.pill::after {
      content: " ▾";
      font-size: 15px;
      opacity: .75;
    }

    .picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
      padding: 12px;
      border-radius: 20px;
      background: rgba(18, 49, 74, .45);
      border: 2px solid rgba(255, 246, 230, .25);
    }

    .picker.hidden {
      display: none;
    }

    .picker .lvl {
      font-family: inherit;
      font-size: 19px;
      font-weight: 700;
      min-width: 46px;
      padding: 9px 10px;
      border-radius: 14px;
      border: 2px solid rgba(255, 246, 230, .35);
      background: rgba(255, 246, 230, .12);
      color: var(--cream);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .picker .lvl.on {
      background: var(--sun);
      border-color: var(--sun-dk);
      color: var(--ink);
    }

    .picker .lvl .what {
      display: block;
      font-size: 11px;
      font-weight: 600;
      opacity: .8;
      margin-top: 2px;
    }

    .streakbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(18, 49, 74, .35);
      border: 2px solid rgba(255, 246, 230, .2);
    }

    .streaktext {
      color: var(--cream);
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pips {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: flex-start;
    }

    .pip {
      width: 100%;
      max-width: 26px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 246, 230, .18);
      border: 2px solid rgba(255, 246, 230, .28);
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }

    .pip.on {
      background: var(--sun);
      border-color: var(--sun-dk);
      transform: scale(1.12);
    }

    /* A longer level needs slimmer dots to stay on one row. */
    .pips.many {
      gap: 3px;
    }

    .pips.many .pip {
      max-width: 16px;
      height: 12px;
      border-width: 1px;
    }

    .card {
      background: linear-gradient(180deg, var(--cream) 0%, var(--cream2) 100%);
      border-radius: 28px;
      padding: 18px 18px 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .28);
      text-align: center;
      animation: pop .35s cubic-bezier(.2, 1.4, .5, 1) both;
    }

    .prompt {
      font-size: 20px;
      font-weight: 700;
      color: #5a6c7d;
      margin: 2px 0 6px;
    }

    .picture {
      font-size: clamp(110px, 34vw, 170px);
      line-height: 1.1;
      user-select: none;
      animation: float 3.2s ease-in-out infinite;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    /* On the read-the-word level the card shows the word instead of a picture. */
    .picture.asword {
      font-size: clamp(46px, 13vw, 72px);
      font-weight: 800;
      font-family: inherit;
      color: var(--ink);
      animation: none;
      padding: 18px 6px;
      letter-spacing: .02em;
    }

    .word {
      height: 46px;
      font-size: 38px;
      font-weight: 800;
      color: var(--good);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
    }

    .word.show {
      opacity: 1;
      transform: translateY(0);
    }

    .sayrow {
      margin-top: 6px;
    }

    .sayrow.hidden {
      display: none;
    }

    .say {
      border: 3px solid var(--ink);
      background: var(--sun);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 22px;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-shadow: 0 5px 0 var(--sun-dk);
      transition: transform .08s ease, box-shadow .08s ease;
    }

    .say:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--sun-dk);
    }

    .say:disabled {
      background: #e6ded1;
      border-color: #b3a894;
      color: #7b7264;
      box-shadow: 0 5px 0 #c9bfae;
      cursor: default;
      font-size: 17px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    /* Whole words as options: one per row, so long words stay readable. */
    .options.words {
      grid-template-columns: 1fr;
      gap: 11px;
      max-width: 520px;
      margin-inline: auto;
    }

    .options.words .opt {
      font-size: clamp(30px, 8vw, 42px);
      padding: 14px 10px 16px;
      letter-spacing: .02em;
    }

    /* Pictures as options. */
    .options.pics .opt {
      font-size: clamp(50px, 15vw, 76px);
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      padding: 16px 6px 18px;
    }

    .options.two {
      grid-template-columns: repeat(2, 1fr);
      max-width: 460px;
      margin-inline: auto;
    }

    .opt {
      font-family: inherit;
      font-size: clamp(56px, 16vw, 82px);
      font-weight: 800;
      line-height: 1;
      padding: 24px 6px 26px;
      border-radius: 24px;
      border: 4px solid var(--ink);
      background: var(--cream);
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-shadow: var(--shadow);
      transition: transform .08s ease, box-shadow .08s ease, background .18s ease, border-color .18s ease;
    }

    .opt:active:not(:disabled) {
      transform: translateY(6px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
    }

    .opt:disabled {
      cursor: default;
    }

    .opt.correct {
      background: var(--good-l);
      border-color: var(--good);
      color: var(--good);
    }

    .opt.wrong {
      background: var(--bad-l);
      border-color: var(--bad);
      color: var(--bad);
      animation: shake .4s;
    }

    .opt.faded {
      opacity: .38;
    }

    .banner {
      margin-top: 16px;
      min-height: 34px;
      font-size: 26px;
      font-weight: 800;
      color: var(--cream);
      text-shadow: 0 2px 0 rgba(0, 0, 0, .28);
    }

    footer {
      margin-top: 14px;
      text-align: center;
      color: rgba(255, 246, 230, .65);
      font-size: 14px;
    }

    footer button {
      font-family: inherit;
      font-size: 14px;
      color: rgba(255, 246, 230, .9);
      background: transparent;
      border: 2px solid rgba(255, 246, 230, .4);
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 12px;
      height: 16px;
      border-radius: 3px;
      z-index: 50;
      pointer-events: none;
      animation: fall linear forwards;
    }

    .banner.big {
      font-size: 32px;
      color: var(--sun);
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes bump {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.25) rotate(-3deg);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg);
      }

      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-9px);
      }

      40% {
        transform: translateX(9px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: .9;
      }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 22px;
      }

      .pill {
        font-size: 16px;
        padding: 5px 11px;
      }

      .streaktext {
        font-size: 14px;
      }

      .pip {
        height: 11px;
      }

      .options {
        gap: 9px;
      }

      .opt {
        border-radius: 18px;
        padding: 16px 2px 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .picture,
      .card,
      .opt.wrong {
        animation: none;
      }
    }
  </style>
</head>

      say: document.getElementById("say"),
      reset: document.getElementById("reset"),
      levelPill: document.getElementById("levelPill"),
      starsPill: document.getElementById("starsPill"),
      cyclesPill: document.getElementById("cyclesPill"),
      progressText: document.getElementById("progressText"),
      levelPicker: document.getElementById("levelPicker"),
      sayrow: document.getElementById("sayrow"),
      sky: document.getElementById("sky"),
      skyNext: document.getElementById("skyNext"),
      pips: document.getElementById("pips")
    };

    var CHEERS = ["יופי!", "כל הכבוד!", "מעולה!", "נכון מאוד!", "אלוף!", "בול!", "וואו!"];
    var NUDGES = ["כמעט, נסה שוב", "לא נורא, עוד ניסיון", "תנסה אפשרות אחרת", "כמעט! עוד פעם"];

    var current = null;
    var currentGroup = null;
    var currentAnswer = "";
    var level = 1;
    var solved = 0;      /* correct answers so far in this level */
    var stars = 0;
    var cycles = 0;      /* how many times every level was completed */
    var firstTry = true;
    var locked = false;

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function pickGroup() {
      var groups = LEVELS[level].groups;
      var total = 0, i;
      for (i = 0; i < groups.length; i++) total += groups[i].weight;
      var r = Math.random() * total;
      for (i = 0; i < groups.length; i++) {
        r -= groups[i].weight;
        if (r <= 0) return groups[i];
      }
      return groups[groups.length - 1];
    }

    function pickKey(group) {
      /* Vowel levels weight every choice equally, so no answer dominates. */
      if (isVowelMode(LEVELS[level].mode)) return pick(group.keys);

      var total = 0, i;
      for (i = 0; i < group.keys.length; i++) {
        total += Math.min(group.byKey[group.keys[i]].length, LETTER_CAP);
      }
      var r = Math.random() * total;
      for (i = 0; i < group.keys.length; i++) {
        r -= Math.min(group.byKey[group.keys[i]].length, LETTER_CAP);
        if (r <= 0) return group.keys[i];
      }
      return group.keys[group.keys.length - 1];
    }

    function drawWord(group) {
      var key = pickKey(group);
      if (!group.decks[key] || group.decks[key].length === 0) {
        group.decks[key] = shuffle(group.byKey[key].slice());
      }
      return group.decks[key].pop();
    }

    /* ---------- sound: short tones synthesised on the fly, no audio files ---------- */
    var audioCtx = null;

    function ensureAudio() {
      if (audioCtx) {
        /* iOS parks the context in "suspended" until a real touch resumes it. */
        if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
        return audioCtx;
      }
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, startAt, duration, type, volume) {
      var ctx = ensureAudio();
      if (!ctx) return;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      var t0 = ctx.currentTime + startAt;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(volume || 0.25, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    }

    function playCorrect() {
      tone(660, 0, 0.16, "triangle", 0.3);
      tone(880, 0.13, 0.18, "triangle", 0.3);
      tone(1320, 0.27, 0.28, "triangle", 0.22);
    }

    function playWrong() {
      tone(200, 0, 0.22, "sawtooth", 0.16);
      tone(150, 0.14, 0.26, "sawtooth", 0.14);
    }

    /* ---------- speech ----------
       Unpointed Hebrew is ambiguous, so the engine has to guess vowels and often gets them
       wrong. We hand it the vocalized spelling from SAY instead, which Hebrew voices honour. */
    var hebrewVoice = null;
    var speechState = "unknown";   /* unknown | ok | none */
    var touched = false;           /* set on the first touch/click, unlocks audio */

    function loadVoices() {
      if (!window.speechSynthesis) { speechState = "none"; updateSayButton(); return; }

      var voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return;   /* not populated yet; onvoiceschanged will call us again */

      var found = null;
      for (var i = 0; i < voices.length; i++) {
        var lang = (voices[i].lang || "").toLowerCase();
        if (lang.indexOf("he") === 0 || lang.indexOf("iw") === 0) {
          /* Carmit is the macOS Hebrew voice and reads nikud best. */
          if (!found || /carmit/i.test(voices[i].name || "")) found = voices[i];
        }
      }

      hebrewVoice = found;
      speechState = found ? "ok" : "none";
      updateSayButton();
    }

    function updateSayButton() {
      if (!el.say) return;
      if (speechState === "none") {
        el.say.disabled = true;
        el.say.textContent = "🔇 אין קול עברי במחשב";
      } else {
        el.say.disabled = false;
        el.say.textContent = "🔊 תגיד לי שוב";
      }
    }

    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    var speakTimer = null;

    function speak(text, rate) {
      if (!window.speechSynthesis || speechState === "none") return;
      /* iOS refuses to speak until the user has touched the screen once, and a
         blocked first utterance can wedge the queue, so wait for that touch. */
      if (!touched) return;

      var synth = window.speechSynthesis;
      try {
        /* One tap can reach here twice (pointerdown and click), and a cancel()
           issued in the same tick as speak() makes browsers drop the utterance
           and can leave the queue wedged so nothing is spoken again. Collapsing
           repeat calls and queueing on a later tick avoids both. */
        if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
        synth.cancel();

        speakTimer = setTimeout(function () {
          speakTimer = null;
          /* Chrome parks the queue in a paused state after an interrupted utterance. */
          if (synth.paused && synth.resume) synth.resume();

          var u = new SpeechSynthesisUtterance(text);
          u.lang = "he-IL";
          u.rate = rate || 0.85;
          u.pitch = 1.05;
          if (hebrewVoice) u.voice = hebrewVoice;
          synth.speak(u);
        }, 100);
      } catch (e) { /* speech is a bonus, never a blocker */ }
    }

    /* Always speak the vocalized spelling when we have one. */
    function sayWord(rate) {
      if (!current) return;
      speak(SAY[current.word] || current.word, rate);
    }

    /* ---------- confetti ---------- */
    var CONFETTI_COLORS = ["#ffc93c", "#37b3a0", "#e03131", "#4dabf7", "#fff6e6", "#2f9e44"];

    function confetti(count) {
      for (var i = 0; i < count; i++) {
        var piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = pick(CONFETTI_COLORS);
        piece.style.animationDuration = (1.1 + Math.random() * 0.9) + "s";
        piece.style.animationDelay = (Math.random() * 0.25) + "s";
        document.body.appendChild(piece);
        (function (node) {
          setTimeout(function () {
            if (node.parentNode) node.parentNode.removeChild(node);
          }, 2600);
        })(piece);
      }
    }

    /* ---------- lookalike words ----------
       The reading levels are only worth anything if the wrong answers are
       tempting, so distractors are the words that look most like the answer:
       same opening letter, same length, same ending, letters in common. A child
       who reads only the first letter should not be able to guess. */
    var BY_WORD = {};
    (function () {
      for (var i = 0; i < WORDS.length; i++) BY_WORD[WORDS[i].word] = WORDS[i];
    })();

    function letterBag(w) {
      var bag = {};
      for (var i = 0; i < w.length; i++) bag[w.charAt(i)] = (bag[w.charAt(i)] || 0) + 1;
      return bag;
    }

    function similarity(target, bag, other) {
      if (other === target) return -1;
      var score = 0;
      if (other.charAt(0) === target.charAt(0)) score += 4;
      if (other.length === target.length) score += 3;
      else if (Math.abs(other.length - target.length) === 1) score += 1;
      if (lastChar(other) === lastChar(target)) score += 2;
      if (NIKUD[other] && NIKUD[other] === NIKUD[target]) score += 2;

      var seen = {};
      for (var i = 0; i < other.length; i++) {
        var c = other.charAt(i);
        seen[c] = (seen[c] || 0) + 1;
        if (bag[c] && seen[c] <= bag[c]) score += 1;
      }
      return score;
    }

    /* Returns the n most confusable words, chosen at random from a pool of the
       closest matches so the same trio does not come up every time. */
    function lookalikes(target, n) {
      var bag = letterBag(target);
      var scored = [];
      for (var i = 0; i < WORDS.length; i++) {
        var w = WORDS[i].word;
        var s = similarity(target, bag, w);
        if (s >= 0) scored.push({ word: w, score: s });
      }
      scored.sort(function (a, b) { return b.score - a.score; });

      var poolSize = Math.min(scored.length, Math.max(n * 4, 10));
      var pool = [];
      for (var p = 0; p < poolSize; p++) pool.push(scored[p].word);
      shuffle(pool);
      return pool.slice(0, n);
    }

    /* Distractors come from the same group as the answer, so level 4 pits sofit forms
       against other sofit forms rather than against easy plain letters. */
    /* ---------- rounds ---------- */
    function buildChoices(correct, group) {
      if (isWordMode(LEVELS[level].mode)) {
        var n = (LEVELS[level].options || 3) - 1;
        return shuffle([correct].concat(lookalikes(correct, n)));
      }
      if (isVowelMode(LEVELS[level].mode)) {
        var cfg = LEVELS[level];
        var all = [];
        for (var gi = 0; gi < cfg.groups.length; gi++) {
          var gk = cfg.groups[gi].keys;
          for (var gj = 0; gj < gk.length; gj++) {
            if (all.indexOf(gk[gj]) === -1) all.push(gk[gj]);
          }
        }

        /* A contrast level always puts one fixed mark against a single alternative,
           so exactly one button is the contrast mark whichever way the answer falls. */
        if (cfg.contrast) {
          if (correct !== cfg.contrast) return shuffle([cfg.contrast, correct]);
          var others = [];
          for (var oi = 0; oi < all.length; oi++) {
            if (all[oi] !== cfg.contrast) others.push(all[oi]);
          }
          return shuffle([cfg.contrast, pick(others)]);
        }

        var cap = cfg.options || all.length;
        if (cap >= all.length) return shuffle(all);

        /* Keep the answer and fill the rest with distractors from the same group. */
        var rest = [];
        for (var r = 0; r < all.length; r++) if (all[r] !== correct) rest.push(all[r]);
        shuffle(rest);
        return shuffle([correct].concat(rest.slice(0, cap - 1)));
      }

      var bank = group.keys.slice();
      if (bank.length < 3) {
        var groups = LEVELS[level].groups;
        for (var g = 0; g < groups.length; g++) {
          for (var k = 0; k < groups[g].keys.length; k++) {
            if (bank.indexOf(groups[g].keys[k]) === -1) bank.push(groups[g].keys[k]);
          }
        }
      }

      var wanted = Math.min(3, bank.length);
      var choices = [correct];
      var guard = 0;
      while (choices.length < wanted && guard < 300) {
        guard++;
        var candidate = pick(bank);
        if (choices.indexOf(candidate) === -1) choices.push(candidate);
      }
      return shuffle(choices);
    }

    function isNikudLevel() { return LEVELS[level].mode === "nikud"; }
    function isSoundLevel() { return LEVELS[level].mode === "sound"; }
    function isReadWordLevel() { return LEVELS[level].mode === "readword"; }
    function isReadPicLevel() { return LEVELS[level].mode === "readpic"; }

    /* The written form shown to the child on the reading levels.
       It is deliberately simpler than the pointing used for speech: compound
       (hataf) vowels are written as their plain vowel, and the dot inside a
       letter is kept only where it still changes the sound in modern Hebrew,
       which means ב כ פ and a vav standing for shuruk. So לֵּ becomes לֵ and
       עֲ becomes עַ, while סַבּוֹן and שׁוּק keep their dots. */
    var HATAF_PLAIN = {
      "\u05B2": "\u05B7",   /* חטף פתח  -> פתח  */
      "\u05B1": "\u05B6",   /* חטף סגול -> סגול */
      "\u05B3": "\u05B8"    /* חטף קמץ  -> קמץ  */
    };
    var VOWEL_MARKS = "\u05B0\u05B1\u05B2\u05B3\u05B4\u05B5\u05B6\u05B7\u05B8\u05B9\u05BA\u05BB";
    var DAGESH_SOUNDS = "בכפ";

    function simplifyMarks(base, marks) {
      var hasVowel = false, k;
      for (k = 0; k < marks.length; k++) {
        if (VOWEL_MARKS.indexOf(marks.charAt(k)) !== -1) hasVowel = true;
      }

      var out = "";
      for (k = 0; k < marks.length; k++) {
        var c = marks.charAt(k);
        if (HATAF_PLAIN[c]) { out += HATAF_PLAIN[c]; continue; }
        if (c === DAGESH) {
          /* A lone dot on a vav is a shuruk; anything else is a dagesh. */
          var keep = base === VAV ? !hasVowel : DAGESH_SOUNDS.indexOf(base) !== -1;
          if (!keep) continue;
        }
        out += c;
      }
      return out;
    }

    function vocalized(w) {
      var src = SAY[w] || w;
      var out = "";
      var i = 0;
      while (i < src.length) {
        var base = src.charAt(i);
        var marks = "";
        var j = i + 1;
        while (j < src.length && COMBINING.indexOf(src.charAt(j)) !== -1) {
          marks += src.charAt(j);
          j++;
        }
        out += base + simplifyMarks(base, marks);
        i = j;
      }
      return out;
    }

    /* The vowel levels show the word's own first letter carrying each option.
       The sound levels use one canonical mark per sound, so the shape of the
       mark never hints at which button is the right one. */
    function faceOf(value) {
      if (isReadWordLevel()) return vocalized(value);
      if (isReadPicLevel()) return BY_WORD[value].pic;

      var first = current.word.charAt(0);

      if (isSoundLevel()) {
        if (value === "O") return first + VAV + HOLAM;
        if (value === "U") return first + VAV + DAGESH;
        return first + SOUND_MARK[value];
      }

      if (!isNikudLevel()) return value;

      var face = first + MARK[value];
      if (value === "y") face += "\u05d9";   /* chirik male carries its yud */
      return face;
    }

    function nameOf(value) {
      if (isSoundLevel()) return SOUND_NAMES[value];
      if (isNikudLevel()) return NIKUD_NAMES[value];
      if (isWordMode(LEVELS[level].mode)) return value;
      return LETTER_NAMES[value] || "";
    }

    function revealText() {
      if (isReadWordLevel()) return vocalized(current.word);
      /* The word is already on screen as the question, so show the picture. */
      if (isReadPicLevel()) return current.pic;
      if (!isNikudLevel() && !isSoundLevel()) return current.word;

      var w = current.word;
      var cls = NIKUD[w];
      /* An o or u sound belongs on the vav whenever the plain spelling has one,
         even when the vocalized form writes it as a holam haser on the letter. */
      if ((cls === "o" || cls === "h" || cls === "u") && w.charAt(1) === VAV) {
        return w.charAt(0) + VAV + (cls === "u" ? DAGESH : HOLAM) + w.slice(2);
      }
      return w.charAt(0) + MARK[cls] + w.slice(1);
    }

    function bump(node) {
      node.classList.remove("bump");
      void node.offsetWidth;
      node.classList.add("bump");
    }

    /* ---------- worlds ----------
       The sky changes after levels 2, 5 and 13, so moving up feels like
       arriving somewhere new rather than just seeing a bigger number. */
    var WORLDS = [
      { from: 1, deep: "#12314a", mid: "#1f6f7a", shore: "#37b3a0" },  /* ocean    */
      { from: 3, deep: "#231145", mid: "#6d3b86", shore: "#c86b8a" },  /* twilight */
      { from: 6, deep: "#0f2e22", mid: "#2b6b4a", shore: "#7fb069" },  /* forest   */
      { from: 14, deep: "#2d1220", mid: "#8a3a3a", shore: "#e0915a" }, /* embers   */
      { from: 17, deep: "#150b2e", mid: "#2d3a8c", shore: "#3aa8e0" }  /* cosmos   */
    ];

    function worldOf(lvl) {
      var found = 0;
      for (var i = 0; i < WORLDS.length; i++) if (lvl >= WORLDS[i].from) found = i;
      return found;
    }

    function skyOf(world) {
      var w = WORLDS[world];
      return "radial-gradient(1200px 600px at 80% -10%, rgba(255,201,60,.35), transparent 60%)," +
        "radial-gradient(900px 500px at 10% 110%, rgba(55,179,160,.45), transparent 60%)," +
        "linear-gradient(165deg, " + w.deep + " 0%, " + w.mid + " 58%, " + w.shore + " 100%)";
    }

    var shownWorld = -1;
    var skyTimer = null;

    function commitSky(world) {
      el.sky.style.background = skyOf(world);
      document.body.style.background = WORLDS[world].deep;
      el.skyNext.style.transition = "none";
      el.skyNext.style.opacity = "0";
      void el.skyNext.offsetWidth;
      el.skyNext.style.transition = "";
    }

    function applyWorld(lvl) {
      var world = worldOf(lvl);
      if (world === shownWorld) return;

      /* A fade still in flight is finished at once, so jumping between worlds
         quickly can never leave the spare layer stranded on screen. */
      if (skyTimer) {
        clearTimeout(skyTimer);
        skyTimer = null;
        if (shownWorld !== -1) commitSky(shownWorld);
      }

      if (shownWorld === -1) {
        shownWorld = world;
        commitSky(world);
        return;
      }

      /* Fade the new sky in on the spare layer, then make it the base. */
      shownWorld = world;
      el.skyNext.style.background = skyOf(world);
      el.skyNext.style.opacity = "1";
      skyTimer = setTimeout(function () {
        skyTimer = null;
        commitSky(world);
      }, 1200);
    }
    /* ---------- level picker ---------- */
    var MODE_LABEL = {
      first: "ראשונה", last: "אחרונה", nikud: "ניקוד",
      sound: "ניקוד", readword: "קריאה", readpic: "קריאה"
    };

    function buildPicker() {
      el.levelPicker.innerHTML = "";
      for (var n = 1; n <= LAST_LEVEL; n++) {
        (function (target) {
          var btn = document.createElement("button");
          btn.className = "lvl";
          btn.type = "button";
          btn.setAttribute("data-level", target);
          btn.innerHTML = target + '<span class="what">' + MODE_LABEL[LEVELS[target].mode] + "</span>";
          btn.setAttribute("aria-label", LEVELS[target].label);
          btn.addEventListener("click", function () { goToLevel(target); });
          el.levelPicker.appendChild(btn);
        })(n);
      }
    }

    function markPicker() {
      var btns = el.levelPicker.querySelectorAll(".lvl");
      for (var i = 0; i < btns.length; i++) {
        if (i + 1 === level) btns[i].classList.add("on");
        else btns[i].classList.remove("on");
      }
    }

    function showPicker(open) {
      if (open) el.levelPicker.classList.remove("hidden");
      else el.levelPicker.classList.add("hidden");
      el.levelPill.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function pickerIsOpen() { return !el.levelPicker.classList.contains("hidden"); }

    /* Jumping to a level starts it fresh; stars and trophies are kept. */
    function goToLevel(target) {
      level = Math.max(1, Math.min(target, LAST_LEVEL));
      solved = 0;
      showPicker(false);
      renderHud();
      nextQuestion();
    }

    function renderHud() {
      el.levelPill.textContent = LEVELS[level].label;
      el.starsPill.textContent = "⭐ " + stars;
      el.progressText.textContent = "✅ " + solved + " / " + targetFor(level);
      applyWorld(level);
      markPicker();

      if (cycles > 0) {
        el.cyclesPill.classList.remove("hidden");
        el.cyclesPill.textContent = "🏆 " + cycles;
      } else {
        el.cyclesPill.classList.add("hidden");
      }

      var goal = targetFor(level);
      el.pips.className = goal > 12 ? "pips many" : "pips";
      el.pips.innerHTML = "";
      for (var i = 0; i < goal; i++) {
        var pip = document.createElement("div");
        pip.className = i < solved ? "pip on" : "pip";
        el.pips.appendChild(pip);
      }
    }

    function nextQuestion() {
      currentGroup = pickGroup();
      current = drawWord(currentGroup);
      currentAnswer = keyOf(current, LEVELS[level].mode);
      firstTry = true;
      locked = false;

      /* On the read-the-word level the card carries the written word and the
         child gets no audio until they have answered; everywhere else it shows
         the picture and may be read aloud. */
      var readingOnly = isReadPicLevel();
      if (readingOnly) {
        el.picture.textContent = vocalized(current.word);
        el.picture.className = "picture asword";
        el.sayrow.className = "sayrow hidden";
      } else {
        el.picture.textContent = current.pic;
        el.picture.className = "picture";
        el.sayrow.className = "sayrow";
      }

      /* The answer is not written into the page until it is earned. */
      el.word.textContent = "";
      el.word.classList.remove("show");
      el.banner.textContent = "";
      el.banner.classList.remove("big");
      el.prompt.textContent = LEVELS[level].prompt;

      el.options.innerHTML = "";
      var correct = currentAnswer;
      var choices = buildChoices(correct, currentGroup);
      var shape = "options";
      if (choices.length === 2) shape += " two";
      if (isReadWordLevel()) shape += " words";
      if (isReadPicLevel()) shape += " pics";
      el.options.className = shape;

      for (var i = 0; i < choices.length; i++) {
        (function (value) {
          var btn = document.createElement("button");
          btn.className = "opt";
          btn.type = "button";
          btn.setAttribute("data-value", value);
          btn.textContent = faceOf(value);
          btn.setAttribute("aria-label", nameOf(value) || faceOf(value));
          btn.addEventListener("click", function () { answer(btn, value, correct); });
          el.options.appendChild(btn);
        })(choices[i]);
      }

      // Restart the card pop animation on every new picture.
      var card = document.querySelector(".card");
      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "";

      if (!readingOnly) sayWord();
    }

    /* Returns the celebration text when a level or a full round was just completed. */
    function advance() {
      solved = 0;
      if (level < LAST_LEVEL) {
        level++;
        return "עלית לשלב " + level + "!";
      }
      cycles++;
      level = 1;
      return "סיימת את כל השלבים! 🏆";
    }

    /* On the letter levels, pressing an option reads that letter's name aloud.
       The follow-up speech is delayed so the name is never cut off mid-word. */
    var LETTER_NAME_MS = 1250;

    function sayLetter(value) {
      if (isNikudLevel() || isSoundLevel() || isWordMode(LEVELS[level].mode)) return 0;
      speak(LETTER_SAY[value] || LETTER_NAMES[value] || value, 0.8);
      return LETTER_NAME_MS;
    }

    function answer(btn, value, correct) {
      if (locked || btn.disabled) return;

      var spoken = sayLetter(value);

      if (value !== correct) {
        firstTry = false;
        btn.classList.add("wrong");
        btn.disabled = true;
        playWrong();
        el.banner.textContent = pick(NUDGES);
        return;
      }

      locked = true;
      btn.classList.add("correct");
      var buttons = el.options.querySelectorAll(".opt");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (buttons[i] !== btn) buttons[i].classList.add("faded");
      }
      el.word.textContent = revealText();
      el.word.classList.add("show");
      playCorrect();

      var promoted = "";
      if (firstTry) {
        stars++;
        solved++;
        if (solved >= targetFor(level)) promoted = advance();
      }
      renderHud();
      bump(promoted ? el.levelPill : el.starsPill);

      if (promoted) {
        el.banner.textContent = promoted;
        el.banner.classList.add("big");
        confetti(cycles > 0 && level === 1 ? 220 : 130);
        tone(523, 0.35, 0.2, "triangle", 0.28);
        tone(659, 0.5, 0.2, "triangle", 0.28);
        tone(784, 0.65, 0.45, "triangle", 0.3);
        setTimeout(function () { speak(promoted, 0.95); }, spoken + 700);
        setTimeout(nextQuestion, spoken + 3600);
        return;
      }

      el.banner.textContent = firstTry ? pick(CHEERS) : "יפה, מצאת!";
      if (firstTry) confetti(18);
      setTimeout(function () { sayWord(0.8); }, spoken + 450);
      setTimeout(nextQuestion, spoken + 2100);
    }

    /* On the read-the-word level hearing the word would be the answer, so audio
       is held back until the child has picked a picture. */
    function mayHearWord() { return !isReadPicLevel() || locked; }

    el.say.addEventListener("click", function () {
      ensureAudio();
      if (mayHearWord()) sayWord(0.75);
    });

    el.levelPill.addEventListener("click", function () {
      showPicker(!pickerIsOpen());
    });

    el.reset.addEventListener("click", function () {
      level = 1;
      solved = 0;
      stars = 0;
      cycles = 0;
      showPicker(false);
      renderHud();
      nextQuestion();
    });

    // Tablets block audio until the first touch; wake sound and speech on it.
    document.addEventListener("pointerdown", function once() {
      document.removeEventListener("pointerdown", once);
      touched = true;
      ensureAudio();
      if (mayHearWord()) sayWord();
    });

    buildPicker();
    renderHud();
    nextQuestion();
  </script>
</body>

</html>
